[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noveldeins-model_hot_swap_consistency_segmenter"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对数据治理与血缘专家·模型热切换的一致性相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "noveldeins" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://noveldeins.github.io"
Repository = "https://github.com/noveldeins/model_hot_swap_consistency_segmenter"
Issues = "https://github.com/noveldeins/model_hot_swap_consistency_segmenter/issues"

[project.scripts]
model_hot_swap_consistency_segmenter = "model_hot_swap_consistency_segmenter:main"

[tool.setuptools]
py-modules = ["model_hot_swap_consistency_segmenter"]
